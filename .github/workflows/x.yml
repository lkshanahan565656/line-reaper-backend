name: diag-xsizelive
on: { push: { branches: [diag-xsizelive] } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: |
          B=https://line-reaper-backend-production.up.railway.app
          mkdir o
          for i in $(seq 1 60); do curl -s "$B/api/status" > o/status.json; if grep -q '"exchangeSize"' o/status.json && grep -q '"scans":[1-9]' o/status.json; then break; fi; sleep 30; done
          sleep 600
          curl -s "$B/api/status" > o/status.json
          curl -s "$B/api/exchange-size?limit=300" > o/xsize.json
          python3 -c "import json;s=json.load(open('o/status.json'));print(s.get('version'));print(json.dumps(s.get('exchangeSize'),indent=1))" > o/summary.txt 2>&1
          cd o && git init -q && git checkout -q -b o && git add -A && git -c user.name=d -c user.email=d@d commit -qm out && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:refs/heads/diag-xsizelive-out
