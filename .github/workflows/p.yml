name: diag-outrights
on:
  push: { branches: [diag-outrights] }
permissions: { contents: write }
concurrency: { group: diag-outrights, cancel-in-progress: true }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe.mjs 2>&1 | tail -400
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b o && git add -A && git -c user.name=d -c user.email=d@d commit -qm "o $(date -u +%FT%TZ)" && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:refs/heads/diag-outrights-out
