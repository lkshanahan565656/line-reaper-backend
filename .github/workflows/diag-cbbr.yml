name: diag-cbbr
on:
  push:
    branches: [diag-cbbr]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: RUNMIN=25 timeout 2900 node diag/cbbr.js || true
      - run: |
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          gzip -9 out/*.json 2>/dev/null || true
          git checkout --orphan diag-cbbr-out; git rm -rq --cached . || true
          git add -f out; git commit -qm out; git push -f origin diag-cbbr-out
