name: diag-push
on:
  push:
    branches: [diag-push]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - run: |
          B=https://line-reaper-backend-production.up.railway.app
          mkdir out
          for i in $(seq 1 80); do
            v=$(curl -s --max-time 20 "$B/" | grep -o '"version":"[^"]*"' || true)
            echo "$(date -u +%H:%M:%S) $v" >> out/wait.txt
            echo "$v" | grep -q '3\.1\(5[89]\|[6-9][0-9]\)\.' && break
            sleep 30
          done
          sleep 60
          curl -s -i --max-time 30 "$B/api/push/selftest" > out/selftest.txt
          curl -s --max-time 30 "$B/api/push/kinds" > out/kinds.json
          curl -s --max-time 30 "$B/api/push/log?n=20" > out/log.json
          curl -s --max-time 30 "$B/api/push/key" | sed 's/"key":"\(.\{12\}\)[^"]*"/"key":"\1..."/' > out/key.json
          curl -s --max-time 30 -o /dev/null -w "%{http_code}\n" -XPOST -H 'content-type: application/json' -d '{"endpoint":"https://fcm.googleapis.com/fcm/send/not-a-device"}' "$B/api/push/test" > out/test-unknown.txt
          curl -s --max-time 60 "$B/api/status" | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps({'version':d.get('version'),'push':d.get('live',{}).get('push'),'backup':d.get('resultsBackup')},indent=1))" > out/status.json || true
          curl -s --max-time 30 "$B/app" | grep -c "pushTest()" > out/app-has-test.txt || true
          curl -s --max-time 30 "$B/sw.js" | grep -c "pushsubscriptionchange" > out/sw-has-change.txt || true
      - run: |
          git init -q o && mv out o/ && cd o
          git config user.name diag-bot && git config user.email diag-bot@users.noreply.github.com
          git checkout -q --orphan diag-push-out && git add out && git commit -qm "diag output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-push-out
