name: esgc
on:
  push:
    branches: [diag-esgradecheck]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev --ignore-scripts
      - run: node diag/esgc.js || true
      - run: |
          cd out && git init -q && git config user.name diag && git config user.email diag@users.noreply.github.com && git add -A && git commit -qm out
          git -c http.extraheader="$(git -C .. config --get http.https://github.com/.extraheader)" push -fq https://github.com/${{ github.repository }}.git HEAD:refs/heads/diag-esgradecheck-out
