name: diag-inplay
on:
  push:
    branches: [diag-inplay]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          set +e
          node diag/probe.js 2>&1 | tail -5
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-inplay-out; git add -f out; git commit -qm "probe"
          for i in 1 2 3 4; do git push -qf origin diag-inplay-out && break; sleep $((i*5)); done
