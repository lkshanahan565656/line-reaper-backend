name: diag-pppay
on: { push: { branches: [diag-pppay] } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mkdir -p out && node probe.js || true
      - if: always()
        run: |
          cd out && git init -q && git checkout -q -b diag-pppay-out && git add . && git -c user.name=diag -c user.email=diag@x commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-pppay-out
