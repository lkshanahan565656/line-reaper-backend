name: diag-props
on:
  push:
    branches: [diag-props]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          { date -u; node diag/props.js; } > diag-out.txt 2>&1 || true
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout --orphan diag-props-out
          git rm -rq --cached . || true
          git add -f diag-out.txt
          git commit -qm "diag output"
          git push -f origin diag-props-out
