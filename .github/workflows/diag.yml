name: diag-esmodels
on: { push: { branches: [diag-esmodels] } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: mkdir -p out && (python3 -m http.server 8080 &) && sleep 2 && node render.js
      - run: |
          curl -s https://line-reaper-backend-production.up.railway.app/api/status | head -c 400 > out/status.txt || true
          cd out && git init -q && git checkout -q -b diag-esmodels-out && git add . && git -c user.name=diag -c user.email=diag@x commit -qm out
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-esmodels-out
