name: diag-texas
on: { push: { branches: [diag-texas] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { path: d }
      - uses: actions/checkout@v4
        with: { ref: claude/texas-venues-xeeezt, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          set +e
          cd app && npm ci --no-audit --no-fund >/dev/null 2>&1 && cd ..
          mkdir -p out && cp -r d/scripts . && NODE_PATH=app/node_modules node scripts/gemdist.js > out/log.txt 2>&1
          git init -q o && cp -r out/* o/ && cd o && git checkout -q -b diag-texas-out3 && git add -A && git -c user.name=d -c user.email=d@d commit -qm out
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} diag-texas-out3
