name: diag
on:
  push:
    branches: [diag-xarb]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          for i in $(seq 1 40); do curl -sS -m 20 https://line-reaper-backend-production.up.railway.app/api/status | grep -q '"3.80.1"' && break; sleep 30; done; { date -u; curl -sS -m 30 https://line-reaper-backend-production.up.railway.app/app | grep -c bidsProven; node diag/sharp-tabs.js; } > diag-out.txt 2>&1 || true; node diag/snap.js || true
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-out
          git add -f diag-out.txt snap
          git commit -m "diag output"
          git push -f origin diag-out
