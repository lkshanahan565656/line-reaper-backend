name: diag-injstale
on: { push: { branches: [diag-injstale] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: (python3 -m venv v > log.txt 2>&1 && . v/bin/activate && pip install -q pdfplumber >> log.txt 2>&1; python fetch.py >> log.txt 2>&1 || echo "exit $?" >> log.txt); mkdir -p out; cp log.txt out/; cd out && git init -q && git checkout -q -b diag-injstale-out && git add -A && git -c user.name=d -c user.email=d@d commit -qm out && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} diag-injstale-out
