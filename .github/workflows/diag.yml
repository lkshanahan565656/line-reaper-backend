name: diag-exrec
on:
  push: { branches: [diag-exrec] }
  workflow_dispatch: { inputs: { n: { default: '1' } } }
permissions: { contents: write, actions: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: |
          N=${{ inputs.n || '1' }}
          mkdir -p out
          ( python3 rec.py 330 ) &
          R=$!
          push() { rm -rf /tmp/o && mkdir /tmp/o && cp -r out/* /tmp/o/ 2>/dev/null; cd /tmp/o && git init -q && git checkout -q -b diag-exrec-out-$N && git add -A && git -c user.name=d -c user.email=d@d commit -qm out && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} diag-exrec-out-$N; cd -; }
          while kill -0 $R 2>/dev/null; do sleep 600; push; done
          push
          if [ "$N" -lt 10 ]; then gh workflow run diag.yml --ref diag-exrec -f n=$((N+1)) -R ${{ github.repository }}; fi
        env: { GH_TOKEN: "${{ github.token }}" }
