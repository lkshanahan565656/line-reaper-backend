name: diag-brstale
on: { push: { branches: [diag-brstale] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set +e
          B=https://line-reaper-backend-production.up.railway.app
          mkdir -p out && cd out
          for i in $(seq 1 25); do v=$(curl -s -m 30 $B/ | jq -r .version); echo "$(date -u +%T) $v" >> wait.txt; [ "$v" = "3.143.0" ] && break; sleep 60; done
          curl -s -m 180 $B/api/ev/scoreboard | jq -c '{rows:[.rows[]|select(.graded>=20)|{kind,book,graded,avgClv,mark,resultsZ,note}],betrivers:.byBook.betrivers.mark}' > board.json
          curl -s -m 120 $B/api/status | jq -c '{version, alert:(.ev.alertBooks // .alertBooks // null)}' > status.json
          cd .. && git init -q o && cp -r out/* o/ && cd o && git checkout -q -b diag-brstale-out2 && git add -A && git -c user.name=d -c user.email=d@d commit -qm out
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} diag-brstale-out2
