name: diag
on:
  push:
    branches: [diag-xarb]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          set +e
          git fetch -q --depth 1 origin main:refs/remotes/origin/x && git worktree add -q app origin/x && (cd app && npm i --omit=dev >/dev/null 2>&1)
          for i in $(seq 1 40); do curl -sS -m 20 https://line-reaper-backend-production.up.railway.app/api/status | grep -q "3.97.0" \&\& break; sleep 30; done; sleep 180; { date -u; npm i axios >/dev/null 2>&1; node diag/post2.js; date -u; } > diag-out.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-out
          git add -f diag-out.txt; true
          git commit -m "diag output"
          git push -f origin diag-out
