name: diag-nbanight5
on: { push: { branches: [diag-nbanight] }, workflow_dispatch: {} }
permissions: { contents: write, deployments: read, statuses: read }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://line-reaper-backend-production.up.railway.app
          R=${{ github.repository }}
          H="Authorization: Bearer ${{ github.token }}"
          mkdir -p out && cd out
          date -u > at.txt
          curl -s -m 120 "$B/api/status" > status.json
          for o in 0 500 1000 1500 2000 2500 3000; do curl -s -m 120 "$B/api/props/board?sport=NBA&limit=500&offset=$o" > nbaboard-$o.json; done
          curl -s -m 120 "$B/api/props/coverage?sport=NBA" > coverage.json
          curl -s -m 120 "$B/api/ev/scoreboard" > scoreboard.json
          curl -s -H "$H" "https://api.github.com/repos/$R/deployments?per_page=5" > deployments.json
          curl -s -H "$H" "https://api.github.com/repos/$R/commits/main" > main.json
          cd ..
          git init -q o && cp -r out/* o/ && cd o && git checkout -q -b diag-nbanight5-out && git add -A && git -c user.name=d -c user.email=d@d commit -qm out
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} diag-nbanight5-out
