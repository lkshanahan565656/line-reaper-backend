name: diag-nbaprobe
on: { push: { branches: [diag-nbaprobe] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py > log.txt 2>&1; mkdir -p out; cp log.txt out/; cd out && git init -q && git checkout -q -b diag-nbaprobe-out && git add -A && git -c user.name=d -c user.email=d@d commit -qm out && git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} diag-nbaprobe-out
