name: diag
on:
  push:
    branches: [diag-xarb]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          set +e
          for i in $(seq 1 40); do curl -sS -m 20 https://line-reaper-backend-production.up.railway.app/api/status | grep -q '"3.91.1"' && break; sleep 30; done
          { date -u; npm i axios >/dev/null 2>&1; node diag/kstale.js; } > diag-out.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-out
          git add -f diag-out.txt
          git commit -m "diag output"
          git push -f origin diag-out
