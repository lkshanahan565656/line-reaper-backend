name: diag-nbanight8
on: { push: { branches: [diag-nbanight] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          B=https://line-reaper-backend-production.up.railway.app
          mkdir -p out && cd out
          date -u > at.txt
          curl -s -m 120 "$B/api/status" | jq -c '{version}' > version.json
          curl -s -m 120 "$B/api/props/record" > precord.json
          curl -s -m 120 "$B/api/tail/record" > tailrecord.json
          cd ..
          git init -q o && cp -r out/* o/ && cd o && git checkout -q -b diag-nbanight8-out && git add -A && git -c user.name=d -c user.email=d@d commit -qm out
          git push -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} diag-nbanight8-out
