name: diag
on:
  push:
    branches: [diag-xarb]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          git fetch origin main && git checkout origin/main -- . && npm install --no-audit --no-fund >/dev/null 2>&1
          { date -u; RUN_MIN=14 node diag/realtime.js; } > diag-out.txt 2>&1 || true
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-out
          git add -f diag-out.txt
          git commit -m "diag output"
          git push -f origin diag-out
