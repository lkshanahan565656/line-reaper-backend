name: diag-lcs
on:
  push:
    branches: [diag-lcs]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: timeout 1200 node diag/clvrun.js || true
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout --orphan diag-lcs-out
          git rm -rq --cached . || true
          git add -f out
          git commit -qm "diag output"
          git push -f origin diag-lcs-out
