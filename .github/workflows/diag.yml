name: diag
on:
  push:
    branches: [diag-xarb]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          set +e
          for i in $(seq 1 40); do curl -sS -m 20 https://line-reaper-backend-production.up.railway.app/api/status | grep -q '"3.83.1"' && break; sleep 30; done
          { date -u; curl -sS -m 60 https://line-reaper-backend-production.up.railway.app/api/results | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s);console.log(JSON.stringify(r.sources.exchangeValue));for(const p of r.plays.filter(p=>p.source==="exchangeValue"))console.log(p.by,"|",p.play,"| n",p.n,"| clv",p.avgClv,"|",p.verdict)})'; } > diag-out.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-out
          git add -f diag-out.txt
          git commit -m "diag output"
          git push -f origin diag-out
