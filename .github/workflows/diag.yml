name: diag
on:
  push:
    branches: [diag-xarb]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          set +e
          git fetch -q --depth 1 origin main:refs/remotes/origin/main && git worktree add -q app origin/main && (cd app && npm i --omit=dev >/dev/null 2>&1)
          { date -u; npm i axios >/dev/null 2>&1; ls app | head -3; export APP=$PWD/app; node diag/steambt.js && node diag/btsim.js; } > diag-out.txt 2>&1 || true
      - if: always()
        run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-out
          git add -f diag-out.txt; git add -f bt-data.json bt-bets.json || true
          git commit -m "diag output"
          git push -f origin diag-out
