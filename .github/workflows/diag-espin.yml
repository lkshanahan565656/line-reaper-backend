name: diag-espin
on:
  push:
    branches: [diag-espin]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          git config --global user.name diag-bot
          git config --global user.email diag-bot@users.noreply.github.com
          mkdir -p out
          MINUTES=330 node diag/eslog.js > out/log.txt 2>&1 &
          PID=$!
          push() {
            rm -rf /tmp/pub && mkdir -p /tmp/pub && cp -r out /tmp/pub/ && cd /tmp/pub && git init -q && git checkout -q -b diag-espin-out && git add -f out && git commit -qm "diag output $(date -u +%H:%M)" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diag-espin-out; cd - >/dev/null
          }
          sleep 240; push
          while kill -0 $PID 2>/dev/null; do sleep 900; push || true; done
          push
