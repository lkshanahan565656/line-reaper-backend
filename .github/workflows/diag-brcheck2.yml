name: diag-brcheck2
on:
  push:
    branches: [diag-brcheck2]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          set +e
          U=https://line-reaper-backend-production.up.railway.app
          for i in $(seq 1 80); do curl -s $U/api/status | grep -q '3.141.0' && break; sleep 20; done
          mkdir out; curl -s $U/api/status > out/status.json; curl -s $U/api/ev/scoreboard > out/scoreboard.json; date -u +%FT%TZ > out/at.txt
          git init -q; git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -q -b diag-brcheck3-out; git add out; git commit -qm out
          git push -q -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git diag-brcheck3-out
