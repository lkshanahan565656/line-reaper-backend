name: diag-lolmu
on:
  push:
    branches: [diag-lolmu]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: diag
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node diag/diag/pm.js > out.json 2> log.txt || true
      - name: publish
        run: |
          mkdir pub && cp out.json log.txt pub/ && cd pub && git init -q && git checkout -q -b diag-lolmu-out
          git -c user.name=diag -c user.email=diag@x add . && git -c user.name=diag -c user.email=diag@x commit -qm out
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}" diag-lolmu-out
        env:
          GITHUB_TOKEN: ${{ github.token }}
