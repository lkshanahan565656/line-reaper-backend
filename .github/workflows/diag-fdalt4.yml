name: diag-fdalt4
on:
  push:
    branches: [diag-fdalt4]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: timeout 1200 node diag/live.js || true
      - run: |
          git config user.name diag-bot && git config user.email diag-bot@users.noreply.github.com
          git checkout -q --orphan diag-fdalt4-out && git rm -rq --cached . && git add -f out && git commit -qm out && git push -q -f origin diag-fdalt4-out
