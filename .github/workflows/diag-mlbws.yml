name: diag-mlbws
on:
  push:
    branches: [diag-mlbws]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node live.js
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout --orphan diag-mlbws-out
          git rm -rq --cached . || true
          true
          git add -f out
          git commit -qm "mlb output"
          git push -f origin diag-mlbws-out
