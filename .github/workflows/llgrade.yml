name: diag-llgrade
on: { push: { branches: [diag-llgrade] } }
permissions: { contents: write }
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --omit=dev --ignore-scripts
      - run: node diag/llgrade.js
      - run: |
          cd res && git init -q && git checkout -q -b o && git add -A && git -c user.name=d -c user.email=d@d commit -qm "results $(date -u +%FT%TZ)" && git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} HEAD:refs/heads/diag-llgrade-out
