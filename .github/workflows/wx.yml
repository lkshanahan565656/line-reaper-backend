name: wx
on:
  push:
    branches: [diag-wx]
concurrency:
  group: wx
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          set +e
          mkdir -p data out
          git show origin/diag-khist-data:nonsports/climateandweather-0.json.gz > data/cw.json.gz
          git show origin/diag-wx-out:out/cache.tar.gz > cache.tar.gz 2>/dev/null && tar xzf cache.tar.gz && rm cache.tar.gz
          SCRIPT=$(cat diag/RUN)
          { date -u; node --max-old-space-size=6000 diag/$SCRIPT; date -u; } > out/out.txt 2>&1
          true
      - if: always()
        run: |
          set +e
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          tar czf cache.tar.gz cache 2>/dev/null; mv cache.tar.gz out/ 2>/dev/null
          git checkout -B diag-wx-out
          git add -f out
          git commit -qm "wx output" ; git push -f origin diag-wx-out
