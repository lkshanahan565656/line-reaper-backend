name: diag-rounds
on:
  push:
    branches: [diag-rounds]
concurrency:
  group: diag-rounds
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: |
          set +e
          node diag/pinsnap.js 2>&1 | tee r.txt
          MINUTES=110 node diag/vlrmaps.js 2>&1 | tee -a r.txt
          true
      - if: always()
        run: |
          set +e
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-rounds-out
          git add -f r.txt data/*.gz data/*.html
          git commit -qm "rounds output" ; git push -f origin diag-rounds-out
