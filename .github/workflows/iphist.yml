name: diag-iphist
on:
  push: { branches: [diag-iphist] }
permissions: { contents: write }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: 'k:LOL', since: '2026-04-01', shard: 0, nshard: 1 }
          - { part: 'k:DOTA', since: '2026-04-01', shard: 0, nshard: 1 }
          - { part: 'k:VAL', since: '2026-04-01', shard: 0, nshard: 1 }
          - { part: 'k:CS2', since: '2026-07-15', shard: 0, nshard: 1 }
          - { part: 'lol', since: '2026-03-25', shard: 0, nshard: 1 }
          - { part: 'lol', since: '2025-01-01', until: '2026-03-25', shard: 1, nshard: 1 }
          - { part: 'dota', since: '2026-04-01', shard: 0, nshard: 4 }
          - { part: 'dota', since: '2026-04-01', shard: 1, nshard: 4 }
          - { part: 'dota', since: '2026-04-01', shard: 2, nshard: 4 }
          - { part: 'dota', since: '2026-04-01', shard: 3, nshard: 4 }
          - { part: 'cs', since: '2026-07-15', shard: 0, nshard: 2 }
          - { part: 'cs', since: '2026-07-15', shard: 1, nshard: 2 }
          - { part: 'val', since: '2026-04-01', shard: 0, nshard: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          set +e
          N=$(echo "${{ matrix.part }}-${{ matrix.shard }}" | tr ':' '-')
          PART="${{ matrix.part }}" SINCE="${{ matrix.since }}" UNTIL="${{ matrix.until }}" SHARD=${{ matrix.shard }} NSHARD=${{ matrix.nshard }} BUDGET_MIN=315 timeout 330m node diag/iphist.js 2>&1 | tee log-$N.txt
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-iphist-out-$N; git add -f log-$N.txt data/*.json.gz; git commit -qm "pull $N"
          for i in 1 2 3 4; do git push -qf origin diag-iphist-out-$N && break; sleep $((i*5)); done
