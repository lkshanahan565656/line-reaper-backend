name: diag-soccer
on:
  push:
    branches: [diag-soccer-fd]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    strategy:
      fail-fast: false
      matrix:
        include:
          - { tag: fd, part: 'res:fd' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          set +e
          PART='${{ matrix.part }}' SINCE=2025-07-01 BUDGET_MIN=140 timeout 150m node diag/pull.js 2>&1 | tee log-${{ matrix.tag }}.txt
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-soccer-out2-${{ matrix.tag }}; git add -f log-${{ matrix.tag }}.txt data; git commit -qm "soccer ${{ matrix.tag }}"
          for i in 1 2 3 4; do git push -qf origin diag-soccer-out2-${{ matrix.tag }} && break; sleep $((i*5)); done
