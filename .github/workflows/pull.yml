name: diag-tennis-hist
on:
  push:
    branches: [diag-tennis-hist]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        span: ['2016-01-01:2020-01-01', '2020-01-01:2024-01-01']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          set +e
          S="${{ matrix.span }}"; A=${S%%:*}; B=${S##*:}; N=${A:0:4}
          PART=res:espn SINCE=$A UNTIL=$B BUDGET_MIN=50 timeout 55m node diag/pull.js 2>&1 | tee log-$N.txt
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-tennis-hist-out-$N; git add -f log-$N.txt data; git commit -qm "espn $S"
          for i in 1 2 3 4; do git push -qf origin diag-tennis-hist-out-$N && break; sleep $((i*5)); done
