name: diag-tennis-k
on:
  push:
    branches: [diag-tennis-k]
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        series: ['KXATPMATCH', 'KXWTAMATCH']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          set +e
          S="${{ matrix.series }}"
          PART=k:all SERIES=$S SINCE=2025-01-01 BUDGET_MIN=150 timeout 160m node diag/pull.js 2>&1 | tee log-$S.txt
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-tennis-k-out-$S; git add -f log-$S.txt data; git commit -qm "kalshi $S"
          for i in 1 2 3 4; do git push -qf origin diag-tennis-k-out-$S && break; sleep $((i*5)); done
