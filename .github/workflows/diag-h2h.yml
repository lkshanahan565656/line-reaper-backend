name: diag-h2h3
on:
  push:
    branches: [diag-h2h3]
concurrency:
  group: diag-h2h3
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: |
          set +e
          mkdir -p out
          SINCE=2025-12-01 MINUTES=80 node diag/vlrmaps.js 2>&1 | tee out/vlr.txt
          cp data/vlrmaps.json.gz out/
          true
      - if: always()
        run: |
          set +e
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-h2h3-out
          git add -f out
          git commit -qm "vlr maps" ; git push -f origin diag-h2h3-out
