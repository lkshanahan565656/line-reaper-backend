name: diag-cbrec
on:
  push:
    branches: [diag-cbrec]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  rec:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: RUNMIN=330 timeout 20400 node diag/cbrec.js || true
        env:
          GH_TOKEN: ${{ github.token }}
      - run: bash diag/push.sh
        env:
          GH_TOKEN: ${{ github.token }}
