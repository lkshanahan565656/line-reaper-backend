name: diag-esresearch
on: { push: { branches: [diag-esresearch] } }
permissions: { contents: write }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-4h0jhf, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: ./live.sh
      - if: always()
        run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan diag-esresearch-out && git rm -rqf --cached . && git add -f out && git commit -qm "esresearch live $(date -u +%FT%TZ)" && git push -f origin HEAD:diag-esresearch-out
