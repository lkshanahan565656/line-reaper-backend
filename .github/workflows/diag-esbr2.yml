name: diag-esbr3
on:
  push:
    branches: [diag-esbr3]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: claude/es-stale-p2tqiq, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd app && (npm ci --omit=dev || npm install --omit=dev)
      - run: MINS=25 timeout 2400 node diag/branch.js || true
      - if: always()
        run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout --orphan diag-esbr3-out
          git rm -rq --cached . || true
          git add -f out
          git commit -qm "diag output"
          git push -f origin diag-esbr3-out
