name: diag-cblive
on:
  push:
    branches: [diag-cblive]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - run: python3 live.py | tee report.txt
      - run: |
          mkdir -p out && cp report.txt out/
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout --orphan diag-cblive-out; git rm -rq --cached . || true
          git add -f out; git commit -qm out; git push -f origin diag-cblive-out
