name: diag-bettrack
on: { push: { branches: [diag-bettrack] } }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: node check.js > out.txt 2>&1 || true
      - run: |
          git config user.email d@x; git config user.name diag
          git checkout --orphan diag-bettrack-out; git rm -rqf --cached . ; git add out.txt; git commit -qm out; git push -f origin diag-bettrack-out
