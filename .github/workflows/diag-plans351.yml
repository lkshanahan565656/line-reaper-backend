name: diag-plans351
on:
  push:
    branches: [diag-plans351]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          U=https://line-reaper-backend-production.up.railway.app
          mkdir -p out
          curl -s -m 60 $U/api/health > out/health.json || true
          curl -s -m 60 $U/api/plans > out/plans.json || true
          curl -s -m 60 $U/pricing > out/pricing.html || true
          curl -s -m 60 -H 'Accept: text/html' $U/ > out/landing.html || true
          curl -s -m 60 $U/api/status | jq '{version, accounts}' > out/status.json || true
          curl -s -m 60 -o /dev/null -w "%{http_code}\n" "$U/app?start=plus&interval=year" > out/app-start.txt || true
          git init -q o && cp -r out o/ && cd o
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -q --orphan diag-plans351-out; git add -f out; git commit -qm "diag output"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag-plans351-out
