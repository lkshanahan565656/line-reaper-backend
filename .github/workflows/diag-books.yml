name: diag-books
on:
  push:
    branches: [diag-books]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          set +e
          npm ci --omit=dev --no-audit --no-fund 2>&1 | tail -2
          mkdir -p out; cd out; node ../diag/${SCRIPT:-evrun.js} > log.txt 2>&1; cd ..
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-books-out; git add -f out; git commit -qm "books out"; git push -qf origin diag-books-out
