name: diag-boosts
on:
  push:
    branches: [diag-boosts]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: timeout 900 node diag/probe.js || true
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout --orphan diag-boosts-out
          git rm -rq --cached . || true
          gzip -r out || true
          git add -f out
          git commit -qm "diag output"
          git push -f origin diag-boosts-out
