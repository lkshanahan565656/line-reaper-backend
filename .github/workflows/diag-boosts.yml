name: diag-boosts
on:
  push:
    branches: [diag-boosts]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          timeout 19800 node diag/poll.js || true
