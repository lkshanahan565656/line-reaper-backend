# NFL Sunday board (nflsunday.js): records every NFL leg on PrizePicks,
# Underdog, Sleeper and DK Pick6 next to Pinnacle, FanDuel and BetRivers from
# Saturday until Monday night's kickoff, and grades it from ESPN as games end.
# GitHub runs a job at most 6 hours, so each run records about 5.5 hours,
# grades what has finished (nflsun-<WEEK>-report) and starts the next run.
# After Monday night's kickoff one last run waits for that game to end and
# grades the whole week. A push to diag-nflsun (or a manual run) starts it.
# No Saturday schedule since 10-27: the NFL board graded losing on every app
# (10-25, 1,700+ sides per app) and the lane is closed, so it no longer holds
# Actions runners all weekend. Free: public repo, built-in token.
name: nfl-sunday
on:
  push:
    branches: [diag-nflsun]
  workflow_dispatch:
    inputs:
      run:
        default: '1'
      mode:
        default: 'record'
      week:
        default: ''
permissions:
  contents: write
  actions: write
# one chain per branch; a new push to diag-nflsun replaces the run in progress
concurrency:
  group: nfl-sunday-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RUN_N: ${{ inputs.run || '1' }}
      MODE: ${{ inputs.mode || 'record' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev --ignore-scripts
      - name: Week and stop time
        run: |
          WEEK="${{ inputs.week }}"; [ -n "$WEEK" ] || WEEK=$(node scripts/nflsunday-week.js)
          # Monday night's kickoff is about 00:15Z Tuesday: record until 01:30Z, grade at 05:30Z
          STOP_AT=$(node -e "const w='$WEEK';console.log(new Date(Date.UTC(+w.slice(0,4),+w.slice(4,6)-1,+w.slice(6,8)+2,1,30)).toISOString())")
          GRADE_AT=$(node -e "console.log(new Date(Date.parse('$STOP_AT')+4*3600e3).toISOString())")
          echo "WEEK=$WEEK" >> "$GITHUB_ENV"; echo "STOP_AT=$STOP_AT" >> "$GITHUB_ENV"; echo "GRADE_AT=$GRADE_AT" >> "$GITHUB_ENV"
          echo "week $WEEK run $RUN_N mode $MODE stop $STOP_AT grade $GRADE_AT"
      - name: Record the board
        if: env.MODE == 'record'
        run: timeout 20100 node scripts/nflsunday-record.js || true
        env:
          RUN_MIN: '330'
      - name: Wait for Monday night's game to end
        if: env.MODE == 'final'
        run: |
          left=$(( $(date -d "$GRADE_AT" +%s) - $(date +%s) ))
          [ "$left" -gt 0 ] && sleep $(( left < 19800 ? left : 19800 )) || true
      - name: Grade what has finished
        if: ${{ !cancelled() }}
        run: timeout 900 node scripts/nflsunday-grade.js || true
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s); stop=$(date -d "$STOP_AT" +%s)
          if [ "$MODE" = final ]; then echo "week graded, chain ends"; exit 0; fi
          if [ "$now" -ge "$stop" ]; then next=final; else next=record; fi
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/nfl-sunday.yml/dispatches \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"run\":\"$((RUN_N+1))\",\"mode\":\"$next\",\"week\":\"$WEEK\"}}"
