name: desktop
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: node22-win-x64, name: LineReaper-Windows.exe }
          - { os: macos-13, target: node22-macos-x64, name: LineReaper-Mac-Intel }
          - { os: macos-14, target: node22-macos-arm64, name: LineReaper-Mac-AppleSilicon }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: npx pkg . --targets ${{ matrix.target }} --output out/${{ matrix.name }}
        shell: bash
      - name: Sign ad hoc (Mac)
        if: runner.os == 'macOS'
        run: codesign --force --sign - out/${{ matrix.name }}
      - name: Smoke test on live feeds
        shell: bash
        run: |
          LR_NO_BROWSER=1 PORT=3777 LR_DATA_DIR="$RUNNER_TEMP/lr" ./out/${{ matrix.name }} > "$RUNNER_TEMP/lr.log" 2>&1 &
          sleep 60
          curl -sf -o /dev/null -w "app: %{http_code} %{size_download} bytes\n" http://localhost:3777/app
          curl -s http://localhost:3777/api/underdog | head -c 200; echo
          curl -s http://localhost:3777/api/exchanges | head -c 200; echo
          grep -E "UD error|PP error|Esports: PP" "$RUNNER_TEMP/lr.log" | head -5 || true
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then (cd out && ditto -c -k --keepParent ${{ matrix.name }} ../dist/${{ matrix.name }}.zip); else cp out/${{ matrix.name }} dist/; fi
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: dist/* }
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: gh release create "${{ github.ref_name }}" dist/* --repo "$GITHUB_REPOSITORY" --title "Line Reaper desktop" --notes "Download the file for your computer and open it. Windows: SmartScreen, More info, Run anyway. Mac: right-click, Open." 
        env: { GH_TOKEN: "${{ github.token }}" }
