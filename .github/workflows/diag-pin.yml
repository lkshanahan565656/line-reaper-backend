name: diag-pin
on:
  push:
    branches: [diag-pin]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: diag-pin, cancel-in-progress: false }
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          set +e
          npm ci --omit=dev --no-audit --no-fund 2>&1 | tail -3
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          mkdir -p out
          git fetch origin diag-pin-out 2>/dev/null && git show origin/diag-pin-out:pinx-state.json > out/pinx-state.json 2>/dev/null || rm -f out/pinx-state.json
          git fetch origin diag-pin-out 2>/dev/null && git worktree add -B diag-pin-out ../pubwt origin/diag-pin-out 2>/dev/null || { git worktree add --orphan -b diag-pin-out ../pubwt 2>/dev/null || git worktree add -B diag-pin-out ../pubwt; }
          publish() { cp out/pinx-* ../pubwt/ 2>/dev/null; cp out/log.txt ../pubwt/log-$GITHUB_RUN_ID.txt; (cd ../pubwt && git add -A . && git commit -qm "pinx $(date -u +%H:%M)" && git push -qf origin diag-pin-out); }
          ( while sleep 1200; do publish; done ) &
          cd out && DUR_MIN=${DUR_MIN:-330} TICK_S=60 node ../diag/pinx.js > log.txt 2>&1; cd ..
          publish
