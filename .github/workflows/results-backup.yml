# Keeps the track records across Railway deploys (see backup.js): fetches the
# live app's encrypted snapshot and force-pushes it as the only commit on the
# results-data branch, which the next deploy reads back on boot. Runs on a
# schedule and on every push to main, so the snapshot is taken from the old
# container while the new one builds. Free: public repo, built-in token.
name: results-backup
on:
  schedule:
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: results-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL || 'https://line-reaper-backend-production.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github }
      - name: Fetch the snapshot from the live app
        id: fetch
        run: |
          code=$(curl -sS -o new.json -w '%{http_code}' --max-time 180 "$APP_URL/api/results/backup") || code=000
          if [ "$code" != 200 ] || ! jq -e '.v == 1 and (.data | length > 0) and .keyId' new.json >/dev/null; then
            echo "::notice::No snapshot from the app (HTTP $code); nothing to keep this run."
            exit 0
          fi
          jq -c '{at, keyId, counts, other}' new.json
          echo "ok=1" >> "$GITHUB_OUTPUT"
      - name: Keep it unless it lost records
        if: steps.fetch.outputs.ok == '1'
        run: |
          git init -q keep && cd keep
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin results-data 2>/dev/null && git show FETCH_HEAD:results.json > ../old.json 2>/dev/null; then
            # same key: refuse only a snapshot that lost records in bulk (a
            # container that came up without its restore): fewer records in
            # all, or one store down by more than 20 records and 10%. A store
            # that trims a few rows, or was renamed or switched off, never
            # blocks it (10-25: esportsMatchups 9 -> 0 held the backup a day).
            lost=$(jq -n -f ../.github/backup-guard.jq --slurpfile o ../old.json --slurpfile n ../new.json)
            if [ "$lost" != 0 ]; then
              echo "::warning::The new snapshot has fewer records than the kept one; keeping the old one."
              jq -c '{old: $o[0].counts, new: $n[0].counts}' -n --slurpfile o ../old.json --slurpfile n ../new.json
              exit 0
            fi
          fi
          cp ../new.json results.json
          git add results.json
          git -c user.name='line-reaper-backup' -c user.email='actions@users.noreply.github.com' commit -qm "Results backup $(jq -r .at results.json)"
          git push -qf origin HEAD:refs/heads/results-data
