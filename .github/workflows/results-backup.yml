# Keeps the track records across Railway deploys (see backup.js): fetches the
# live app's encrypted snapshot and force-pushes it as the only commit on the
# results-data branch, which the next deploy reads back on boot. Runs on a
# schedule and on every push to main, so the snapshot is taken from the old
# container while the new one builds. Free: public repo, built-in token.
# GitHub runs the schedule below only every few hours here, so the 20-minute
# snapshots come from results-backup-loop.yml; this one still snapshots on
# every push to main, from the old container while the new one builds.
name: results-backup
on:
  schedule:
    - cron: '7,27,47 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: results-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: ${{ vars.APP_URL || 'https://line-reaper-backend-production.up.railway.app' }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: .github }
      - name: Fetch the snapshot from the live app and keep it unless it lost records
        env: { GH_TOKEN: '${{ github.token }}' }
        run: bash .github/backup-once.sh
