name: diag-esstable
on:
  push:
    branches: [diag-esstable]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: N=30 timeout 2700 node diag/es.js || true
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout --orphan diag-esstable-out
          git rm -rq --cached . || true
          true
          git add -f out
          git commit -qm "diag output"
          git push -f origin diag-esstable-out
