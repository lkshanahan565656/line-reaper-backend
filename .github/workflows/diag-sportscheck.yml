name: diag-sportscheck
on:
  push:
    branches: [diag-sportscheck]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: WAITVER=3.111.0 SETTLE=3 N=4 timeout 2300 node diag/sports.js || true
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout --orphan diag-sportscheck-out
          git rm -rq --cached . || true
          git add -f out
          git commit -qm "diag output"
          git push -f origin diag-sportscheck-out
