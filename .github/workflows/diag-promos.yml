name: diag-promos
on: { push: { branches: [diag-promos] } }
permissions: { contents: write }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: ./live.sh
      - run: |
          git config user.name diag; git config user.email diag@users.noreply.github.com
          git checkout --orphan diag-promos-out && git rm -rqf --cached . && git add -f out && git commit -qm "promos live $(date -u +%FT%TZ)" && git push -f origin HEAD:diag-promos-out
