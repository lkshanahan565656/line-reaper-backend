name: audit
on: { push: { branches: [diag-audit-1026] } }
permissions: { contents: write }
concurrency: { group: audit-1026, cancel-in-progress: false }
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env: { SITE: 'https://line-reaper-backend-production.up.railway.app' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-audit --no-fund playwright@1.63.0 && npx playwright install --with-deps --only-shell chromium
      - run: node audit.js "$SITE" out || true
      - run: |
          git config user.email audit@line-reaper; git config user.name audit
          mkdir -p /tmp/o && cp -r out /tmp/o/
          git checkout --orphan diag-audit-1026-out; git rm -rqf --cached .; git clean -fdq
          cp -r /tmp/o/out .; git add -f out; git commit -qm "audit $(date -u +%FT%TZ)"
          git push -f origin diag-audit-1026-out
