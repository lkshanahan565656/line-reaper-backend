# Weekend board (nflsunday.js, the NFL Sunday recorder with LEAGUES set):
# every NBA, college football and NHL leg on PrizePicks, Underdog, Sleeper and
# DK Pick6 next to Pinnacle, FanDuel and BetRivers from Saturday until the
# last Sunday night game, graded from ESPN after every run. Same chain as
# nfl-sunday.yml: each run records about 5.5 hours, grades what has finished
# (board-<WEEK>-report) and starts the next; the last run waits for Sunday
# night's games to end and grades the weekend. Starts itself every Saturday
# 14:00Z; a push to diag-boards (or a manual run) starts it any other time.
name: weekend-board
on:
  schedule:
    - cron: '0 14 * * 6'
  push:
    branches: [diag-boards]
  workflow_dispatch:
    inputs:
      run:
        default: '1'
      mode:
        default: 'record'
      week:
        default: ''
      leagues:
        default: 'NBA,CFB,NHL'
permissions:
  contents: write
  actions: write
# one chain per branch; a new push to diag-nflsun replaces the run in progress
concurrency:
  group: weekend-board-${{ github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      RUN_N: ${{ inputs.run || '1' }}
      MODE: ${{ inputs.mode || 'record' }}
      LEAGUES: ${{ inputs.leagues || 'NBA,CFB,NHL' }}
      PREFIX: board
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev --ignore-scripts
      - name: Week and stop time
        run: |
          WEEK="${{ inputs.week }}"; [ -n "$WEEK" ] || WEEK=$(node scripts/nflsunday-week.js)
          # Sunday night's last NBA tip is about 02:30Z Monday: record until 03:30Z, grade at 07:00Z
          STOP_AT=$(node -e "const w='$WEEK';console.log(new Date(Date.UTC(+w.slice(0,4),+w.slice(4,6)-1,+w.slice(6,8)+1,3,30)).toISOString())")
          GRADE_AT=$(node -e "console.log(new Date(Date.parse('$STOP_AT')+3.5*3600e3).toISOString())")
          # a push (re)start takes the next free run number, so it never overwrites a recorded run
          RUN="$RUN_N"
          if [ "${{ github.event_name }}" = push ]; then RUN=1; while git ls-remote --exit-code --heads origin "$PREFIX-$WEEK-out-$RUN" >/dev/null 2>&1; do RUN=$((RUN+1)); done; fi
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          echo "WEEK=$WEEK" >> "$GITHUB_ENV"; echo "STOP_AT=$STOP_AT" >> "$GITHUB_ENV"; echo "GRADE_AT=$GRADE_AT" >> "$GITHUB_ENV"
          echo "week $WEEK run $RUN mode $MODE leagues $LEAGUES stop $STOP_AT grade $GRADE_AT"
      - name: Record the board
        if: env.MODE == 'record'
        run: timeout 20100 node scripts/nflsunday-record.js || true
        env:
          RUN_MIN: '330'
          RUN_N: ${{ env.RUN }}
      - name: Wait for Sunday night's games to end
        if: env.MODE == 'final'
        run: |
          left=$(( $(date -d "$GRADE_AT" +%s) - $(date +%s) ))
          [ "$left" -gt 0 ] && sleep $(( left < 19800 ? left : 19800 )) || true
      - name: Grade what has finished
        if: ${{ !cancelled() }}
        run: timeout 900 node scripts/nflsunday-grade.js || true
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s); stop=$(date -d "$STOP_AT" +%s)
          if [ "$MODE" = final ]; then echo "week graded, chain ends"; exit 0; fi
          if [ "$now" -ge "$stop" ]; then next=final; else next=record; fi
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/weekend-board.yml/dispatches \
            -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"run\":\"$((RUN+1))\",\"mode\":\"$next\",\"week\":\"$WEEK\",\"leagues\":\"$LEAGUES\"}}"
