name: diag-close
on:
  push:
    branches: [diag-close]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - run: |
          U=https://line-reaper-backend-production.up.railway.app
          mkdir out; cd out
          for i in $(seq 1 90); do v=$(curl -s $U/api/status | jq -r .version); echo "$i $v"; [ "$v" = "3.128.0" ] && break; sleep 20; done
          echo "deployed $(date -u +%FT%TZ)" > deployed.txt
          sleep 600
          g() { curl -s --max-time 120 "$U$1" > "$2"; echo "$2 $(wc -c < $2)"; }
          g /api/status status.json
          g /api/ev/scoreboard scoreboard.json
          g /api/ev/record ev-record.json
          g "/api/ev/record/bets?status=open&limit=500" ev-main-open.json
          g "/api/ev/record/bets?status=open&alt=1&limit=500" ev-alt-open.json
          date -u +%FT%TZ > at.txt
          cd ..
          git init -q; git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -q -b diag-close-out; git add out; git commit -qm out
          git push -q -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git diag-close-out
