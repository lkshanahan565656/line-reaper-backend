name: diag-heap-measure
on:
  push:
    branches: [diag-heap-measure]
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: claude/project-thread-j5cmcv-heap, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd app && npm ci --omit=dev --ignore-scripts --no-audit --no-fund >/dev/null
      - run: NODE_PATH=app/node_modules node --expose-gc measure.js
