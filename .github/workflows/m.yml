name: diag-heap-measure
on:
  push:
    branches: [diag-heap-measure]
jobs:
  m:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: main, path: app }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd app && npm ci --omit=dev --ignore-scripts --no-audit --no-fund >/dev/null
      - run: MINUTES=10 ./run.sh
