name: diag-pickem
on:
  push:
    branches: [diag-pickem]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev --ignore-scripts
      - run: node relay/pick6.js out/pick6.json
      - run: |
          cd out
          git init -q
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout -q --orphan pick6-data
          git add pick6.json
          git commit -qm "Pick6 board (manual refill)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pick6-data
