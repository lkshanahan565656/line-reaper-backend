name: diag-live
on:
  push:
    branches: [diag-live]
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          U=https://line-reaper-backend-production.up.railway.app
          for i in $(seq 1 40); do
            v=$(curl -s $U/api/status | jq -r .version 2>/dev/null || true)
            echo "$(date -u +%H:%M:%S) $v" >> out/versions.txt
            [ "$v" = "3.133.0" ] && break
            sleep 30
          done
          sleep 600
          curl -s $U/api/status > out/status.json
          curl -s "$U/api/ev?limit=1000" > out/ev.json
          curl -s $U/api/ev/record > out/record.json
          curl -s $U/api/big-money > out/big.json
      - run: |
          git config user.name diag-bot
          git config user.email diag-bot@users.noreply.github.com
          git checkout --orphan diag-live-out
          git rm -rq --cached . || true
          gzip -9 out/*.json
          git add -f out
          git commit -qm "live output"
          git push -f origin diag-live-out
