name: diag-gaps-live
on:
  push:
    branches: [claude/esports-line-gaps-aqjr7c]
    paths: [diag/live.js, .github/workflows/diag-live.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: timeout 1500 node diag/live.js
