name: diag-cleanup-ops
on:
  push:
    branches: [diag-cleanup-ops]
  workflow_dispatch:
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - env:
          # sent to /api/ops/heap and /api/ops/profile, which need it once TRACKER_ADMIN_TOKEN is set on Railway
          ADMIN: ${{ secrets.TRACKER_ADMIN_TOKEN }}
        run: |
          H=(); [ -n "$ADMIN" ] && H=(-H "x-admin-token: $ADMIN")
          U=https://line-reaper-backend-production.up.railway.app
          echo "railway status:"; curl -s -m 20 https://status.railway.com/api/v2/summary.json | python3 -c "import json,sys; j=json.load(sys.stdin); print(j['status']); [print('incident:', i['name'], i['status'], i.get('updated_at')) for i in j.get('incidents',[])]; [print('component:', c['name'], c['status']) for c in j.get('components',[]) if c['status']!='operational']" || echo "status page unreadable"
          echo "root:"; curl -s -m 20 -o /dev/null -w '%{http_code} %{time_total}s\n' $U/
          echo "health:"; curl -s -m 20 $U/api/health | head -c 300; echo
          curl -s -m 30 $U/api/ops > ops.json
          python3 -c "
          import json
          j=json.load(open('ops.json'))
          print('mem',j['memory'],'uptime',j.get('uptimeS'))
          print('top keys', list(j.keys()))
          print('stores', json.dumps(j.get('stores'))[:3000])
          print('pubRecords', json.dumps(j.get('pubRecords'))[:400])
          for k,v in j.items():
            if k not in ('stalls','jobs','loop','gc','stores'): print(k, json.dumps(v)[:300])
          "
          echo "status-sizes:"; curl -s -m 60 $U/api/status > st.json
          python3 -c "
          import json
          j=json.load(open('st.json'))
          for k in ['oddsScreen','lineArchive','propHistory','alertLog','resultsBackup','steam','bigMoves','offshoreRef','esportsBoard','propsBoard','freeBooks','shopDepth','xarb']:
            print(k, json.dumps(j.get(k))[:500])
          big=sorted(((len(json.dumps(v)),k) for k,v in j.items()), reverse=True)[:12]; print('largest status sections', big)
          "
