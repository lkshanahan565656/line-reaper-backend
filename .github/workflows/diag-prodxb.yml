name: diag-mb
on:
  push:
    branches: [diag-mb]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          for id in 1 4 6; do curl -s -A "Mozilla/5.0" -H "Accept: application/json" "https://api.matchbook.com/edge/rest/events?sport-ids=$id&per-page=300&include-prices=true&price-depth=3&states=open&odds-type=DECIMAL" > out/mb-$id.json; done
          curl -s -A "Mozilla/5.0" "https://api.matchbook.com/edge/rest/lookups/sports?per-page=100" > out/sports.json
          git init -q; git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -q -b diag-mb-out; git add out; git commit -qm out
          git push -q -f https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git diag-mb-out
