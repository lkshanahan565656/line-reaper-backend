name: diag-freshbt
on: { push: { branches: [diag-freshbt] }, workflow_dispatch: {} }
concurrency: { group: freshbt, cancel-in-progress: true }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy: { fail-fast: false, matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          set +e
          mkdir -p data
          B=https://line-reaper-backend-production.up.railway.app
          if [ "${{ matrix.shard }}" = "0" ]; then
            curl -s -m 300 "$B/api/tail/record?book=fresh&limit=500" > data/record.json
            curl -s -m 60 "$B/api/status" > data/status.json
          fi
          { date -u; env $(cat diag/ENV 2>/dev/null) SHARD=${{ matrix.shard }} NSHARD=8 node --max-old-space-size=6000 diag/freshbt.js; date -u; } > out.txt 2>&1
          true
      - if: always()
        run: |
          set +e
          git config user.name diag-bot; git config user.email diag-bot@users.noreply.github.com
          git checkout -B diag-freshbt-out-${{ matrix.shard }}
          git add -f out.txt data/ ; git commit -qm "freshbt output"; git push -f origin diag-freshbt-out-${{ matrix.shard }}
